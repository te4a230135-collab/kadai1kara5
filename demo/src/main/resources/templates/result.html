<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結果表示ページ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .result-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .result-label {
            color: #856404;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .result-text {
            color: #333;
            font-size: 20px;
            word-break: break-all;
            background: white;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #ffc107;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .info {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>結果表示ページ</h1>
        <div class="result-box">
            <div class="result-label">入力されたテキスト：</div>
            <div class="result-text" th:text="${userText}">
                テキストがここに表示されます
            </div>
        </div>
        <div class="button-group">
            <form th:action="@{/}" method="get" style="flex: 1;">
                <button type="submit" class="btn-back" style="width: 100%;">戻る</button>
            </form>
        </div>
        <div class="info">
            <strong>説明：</strong>1ページ目で入力したテキストがModelを経由して、ここに表示されています。このテンプレートでは、Thymeleafの<code>th:text</code>属性を使用して、サーバーサイドから送信されたデータを表示しています。
        </div>
    </div>
</body>
</html>
